[project]
name = "ailab-backend"
version = "0.1.0"
description = "Local-first AI Lab backend for image/video generation and model management"
requires-python = ">=3.11"
dependencies = [
    # --- Web framework ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
    # --- Database ---
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    # --- Data validation ---
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # --- ML/AI inference ---
    "torch>=2.2.0",
    "diffusers>=0.30.0",
    "transformers>=4.40.0",
    "accelerate>=0.30.0",
    "safetensors>=0.4.0",
    "Pillow>=10.3.0",
    # --- HTTP clients (model downloads) ---
    "httpx>=0.27.0",
    "huggingface-hub>=0.23.0",
    # --- Utilities ---
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]
video = [
    # Video generation dependencies (optional, heavy)
    "imageio[ffmpeg]>=2.34.0",
]
llm = [
    # Local LLM dependencies (optional)
    "bitsandbytes>=0.43.0",
]
bentoml = [
    "bentoml>=1.2.0",
]

# ═══════════════════════════════════════════════════════════════════════════════
# RUFF — Linting + Formatting (replaces flake8, isort, black, pycodestyle)
# ═══════════════════════════════════════════════════════════════════════════════

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort (import sorting)
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "RUF",    # ruff-specific rules
    "D",      # pydocstyle (docstrings)
    "ANN",    # flake8-annotations (type hints)
    "C4",     # flake8-comprehensions
    "PTH",    # flake8-use-pathlib
    "S",      # flake8-bandit (security)
    "T20",    # flake8-print (no print statements)
    "ERA",    # eradicate (commented-out code)
    "PL",     # pylint subset
    "PERF",   # perflint (performance)
    "C90",    # mccabe complexity
]
ignore = [
    "D100",   # Missing docstring in public module (selective)
    "D104",   # Missing docstring in public package
    "D203",   # one-blank-line-before-class (conflicts with D211)
    "D213",   # multi-line-summary-second-line (conflicts with D212)
    "ANN101", # Missing type annotation for self
    "ANN102", # Missing type annotation for cls
    "ANN401", # Dynamically typed expressions (typing.Any)
    "S101",   # assert used (needed in tests)
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 7
max-returns = 6
max-branches = 12
max-statements = 50

[tool.ruff.lint.isort]
known-first-party = ["app"]
force-single-line = false
lines-after-imports = 2

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# D=docstrings, ANN=annotations, S101=assert-used, PLR2004=magic-value-comparison
"tests/**/*.py" = ["D", "ANN", "S101", "PLR2004"]
"app/adapters/**/*.py" = ["ANN401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

# ═══════════════════════════════════════════════════════════════════════════════
# MYPY — Static type checking
# ═══════════════════════════════════════════════════════════════════════════════

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

[[tool.mypy.overrides]]
module = [
    "diffusers.*",
    "transformers.*",
    "torch.*",
    "torchvision.*",
    "accelerate.*",
    "bentoml.*",
    "safetensors.*",
]
ignore_missing_imports = true

# ═══════════════════════════════════════════════════════════════════════════════
# PYTEST — Test runner configuration
# ═══════════════════════════════════════════════════════════════════════════════

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers -v"
markers = [
    "slow: marks tests that require GPU or heavy computation",
    "integration: marks tests that require a running database",
]

# ═══════════════════════════════════════════════════════════════════════════════
# COVERAGE — Test coverage configuration
# ═══════════════════════════════════════════════════════════════════════════════

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "app/adapters/bentoml/*", "app/adapters/comfyui/*"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = true

