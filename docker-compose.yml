services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - models_cache:/app/models_cache
    environment:
      - MODELS_CACHE_DIR=/app/models_cache
      # Set your CivitAI API key here or via a .env file
      - CIVITAI_API_KEY=${CIVITAI_API_KEY:-}
    # Uncomment to enable NVIDIA GPU support:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  models_cache:
