services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ailab}
      POSTGRES_USER: ${POSTGRES_USER:-ailab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ailab_local}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - storage_data:/app/storage
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://ailab:ailab_local@db:5432/ailab}
      STORAGE_ROOT: ${STORAGE_ROOT:-/app/storage}
      HUGGINGFACE_TOKEN: ${HUGGINGFACE_TOKEN:-}
      CIVITAI_TOKEN: ${CIVITAI_TOKEN:-}
      INFERENCE_DEVICE: auto
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: node:20-slim
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - backend

volumes:
  pgdata:
  storage_data:
  frontend_node_modules: