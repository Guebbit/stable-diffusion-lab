services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - models_cache:/app/models_cache
    environment:
      - MODELS_CACHE_DIR=/app/models_cache
      # Set your CivitAI API key here or via a .env file
      - CIVITAI_API_KEY=${CIVITAI_API_KEY:-}
    # Uncomment to enable NVIDIA GPU support:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    restart: unless-stopped

  frontend:
    image: node:20-slim
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - backend
volumes:
  models_cache:
  frontend_node_modules:
